global:
  scrape_interval: 15s # Default scrape frequency
  evaluation_interval: 15s # Default rule evaluation frequency

# Scrape configurations
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"] 